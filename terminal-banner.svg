<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ana Luiza — terminal</title>
<desc>Janela de terminal animada digitando informações sobre a Ana: quem ela é, hobbies e uma playlist</desc>
<defs>
  <radialGradient id="halo" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
    <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip1"><rect x="44" y="66" width="0" height="20"><animate attributeName="width" from="0" to="76" begin="0.2s" dur="0.3s" fill="freeze"/></rect></clipPath>
  <clipPath id="clip2"><rect x="44" y="96" width="0" height="22"><animate attributeName="width" from="0" to="360" begin="0.7s" dur="1.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="clip3"><rect x="44" y="131" width="0" height="20"><animate attributeName="width" from="0" to="160" begin="2.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <clipPath id="clip4"><rect x="44" y="161" width="0" height="22"><animate attributeName="width" from="0" to="330" begin="3.1s" dur="1.3s" fill="freeze"/></rect></clipPath>
  <clipPath id="clip5"><rect x="44" y="196" width="0" height="20"><animate attributeName="width" from="0" to="120" begin="4.6s" dur="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="clip6"><rect x="44" y="226" width="0" height="22"><animate attributeName="width" from="0" to="290" begin="5.3s" dur="1.2s" fill="freeze"/></rect></clipPath>
</defs>

<ellipse cx="340" cy="150" rx="320" ry="170" fill="url(#halo)">
  <animate attributeName="opacity" values="0.5;0.85;0.5" dur="4s" repeatCount="indefinite"/>
</ellipse>

<rect x="20" y="10" width="640" height="280" rx="12" fill="#0D0819" stroke="#8B5CF6" stroke-width="1.2"/>
<path d="M20 42 L20 22 A12 12 0 0 1 32 10 L648 10 A12 12 0 0 1 660 22 L660 42 Z" fill="#1a1330"/>
<circle cx="44" cy="26" r="6" fill="#c9576b"/>
<circle cx="66" cy="26" r="6" fill="#e0a940"/>
<circle cx="88" cy="26" r="6" fill="#6fbf73"/>
<text x="340" y="30" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#c9b8f7">ana@curitiba: ~</text>

<text x="44" y="80" font-family="Courier New, monospace" font-size="14" fill="#8B5CF6" clip-path="url(#clip1)">$ whoami</text>
<text x="44" y="111" font-family="Courier New, monospace" font-size="14" fill="#e6e0f7" clip-path="url(#clip2)">Ana Luiza — Ciência da Computação, PUCPR</text>

<text x="44" y="145" font-family="Courier New, monospace" font-size="14" fill="#8B5CF6" clip-path="url(#clip3)">$ cat hobbies.txt</text>
<text x="44" y="176" font-family="Courier New, monospace" font-size="14" fill="#e6e0f7" clip-path="url(#clip4)">ballet · natação · confeitaria · música</text>

<text x="44" y="210" font-family="Courier New, monospace" font-size="14" fill="#8B5CF6" clip-path="url(#clip5)">$ echo $bio</text>
<text x="44" y="241" font-family="Courier New, monospace" font-size="14" fill="#e6e0f7" clip-path="url(#clip6)">"sempre explorando lógica e arte"</text>

<text x="44" y="275" font-family="Courier New, monospace" font-size="14" fill="#8B5CF6" opacity="0">
  $
  <animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.1s" fill="freeze"/>
</text>
<rect x="62" y="262" width="9" height="15" fill="#8B5CF6" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.1s" fill="freeze"/>
  <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.9s" repeatCount="indefinite"/>
</rect>
</svg>
